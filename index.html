<!-- index.html
     Entry point. Loads styles and kicks off the app via main.js (ES module).
     The SVG element is the entire canvas — no canvas API, everything is SVG. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Star Field</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <svg id="starfield"></svg>
    <script type="module" src="js/main.js"></script>
</body>
</html>
